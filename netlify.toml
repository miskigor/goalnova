# --- Environment variables (Netlify: Site → Environment variables) ---
# Set secrets in the UI, never commit (see .env.example).
# OPENAI_API_KEY: scope to Functions + Runtime only — NOT Builds (avoids Next inlining into scan output).
# SUPABASE_SERVICE_ROLE_KEY, Stripe keys: same runtime-only pattern when possible.
# NEXT_PUBLIC_SITE_URL (below or in UI): use a valid absolute URL, e.g. https://pitchrusch.com
# (no stray quotes/spaces). Invalid values no longer crash the app, but metadata/OG URLs may be wrong.
#
# --- Password reset (Supabase Auth, not Netlify) ---
# In Supabase Dashboard → Authentication → URL configuration add Redirect URLs so email links work:
#   https://pitchrusch.com/reset-password
#   https://pitchrusch.com/hr/reset-password
#   https://pitchrusch.com/de/reset-password
#   …same path for: bs, es, pt, sr, fr, it, nl, tr, ar
# Optional: add your Netlify deploy-preview pattern if you test recovery on previews.
#
[build]
  # Server bundles may embed runtime-only secrets during `next build` if scoped to Builds.
  environment = { SECRETS_SCAN_OMIT_PATHS = ".next/server" }

[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://pitchrusch.com"
  NEXT_PUBLIC_MOBILE_LAYOUT_STABLE_V2 = "true"

# FFmpeg merge runs inside the Next server handler; more memory = more CPU on Netlify.
[functions]
  external_node_modules = ["ffmpeg-static", "@ffprobe-installer/ffprobe"]

[functions."___netlify-server-handler"]
  memory = 3008

[[redirects]]
  from = "http://pitchrusch.com/*"
  to = "https://pitchrusch.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pitchrusch.com/*"
  to = "https://pitchrusch.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pitchrusch.com/*"
  to = "https://pitchrusch.com/:splat"
  status = 301
  force = true

# Long cache for hashed Next assets; short cache for HTML is handled by Next/Netlify defaults for documents.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
